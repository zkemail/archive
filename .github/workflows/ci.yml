name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm prisma generate
      - name: Check formatting
        run: pnpm prettier:check
      - name: Check linting
        run: pnpm lint:check
      # Guards the signed-statement format (REG-736): payload shape, envelope,
      # channel separation, the fail-closed rules, and that the committed JWKS
      # never carries private key material. Runs without a signing key
      # configured, so it signs with an ephemeral one and needs no secret.
      - name: Check signed-statement format
        run: pnpm statement:check

  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run build
        run: pnpm build

  ingestion:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: tests/ingestion-audit/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: tests/ingestion-audit
      - run: npm test
        working-directory: tests/ingestion-audit
